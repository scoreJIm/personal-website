# Serves the static site over plain HTTP inside the container. TLS is terminated
# by the reverse proxy (see deploy/nginx.conf), which routes jimmyweidev.com here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed static assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
