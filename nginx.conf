# jimmyweidev.com — HTTPS only. Port 80 redirects to 443.

# HTTP: catch-all redirect to the apex domain over HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jimmyweidev.com www.jimmyweidev.com;

    return 301 https://jimmyweidev.com$request_uri;
}

# HTTPS: redirect www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jimmyweidev.com;

    ssl_certificate     /etc/nginx/certs/jimmyweidev.com.pem;
    ssl_certificate_key /etc/nginx/certs/jimmyweidev.com.key;

    return 301 https://jimmyweidev.com$request_uri;
}

# HTTPS: apex serves the site.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name jimmyweidev.com;

    ssl_certificate     /etc/nginx/certs/jimmyweidev.com.pem;
    ssl_certificate_key /etc/nginx/certs/jimmyweidev.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed static assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
