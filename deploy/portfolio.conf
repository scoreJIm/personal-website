# portfolio (static site) served over plain HTTP inside the Docker network.
# TLS is terminated by the `proxy` service, which routes jimmyweidev.com here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
