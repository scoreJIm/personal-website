# Reverse proxy: one HTTPS entry point routing subdomains to their containers.
# TLS is terminated here with a Cloudflare Origin CA cert (wildcard *.jimmyweidev.com).

# HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jimmyweidev.com *.jimmyweidev.com;
    return 301 https://$host$request_uri;
}

# Portfolio (static site)
server {
    listen 443 ssl;
    server_name jimmyweidev.com www.jimmyweidev.com;
    ssl_certificate     /etc/nginx/certs/jimmyweidev.com.pem;
    ssl_certificate_key /etc/nginx/certs/jimmyweidev.com.key;

    location / {
        proxy_pass http://portfolio:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# NeoPick (Java backend, WebSocket)
server {
    listen 443 ssl;
    server_name neo.jimmyweidev.com;
    ssl_certificate     /etc/nginx/certs/jimmyweidev.com.pem;
    ssl_certificate_key /etc/nginx/certs/jimmyweidev.com.key;

    location / {
        proxy_pass http://neopick:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # STOMP WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# AgentSaul (Spring AI, SSE streaming)
server {
    listen 443 ssl;
    server_name agent.jimmyweidev.com;
    ssl_certificate     /etc/nginx/certs/jimmyweidev.com.pem;
    ssl_certificate_key /etc/nginx/certs/jimmyweidev.com.key;

    location / {
        proxy_pass http://agentsaul:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# AI Assistant (FastAPI, SSE streaming)
server {
    listen 443 ssl;
    server_name assistant.jimmyweidev.com;
    ssl_certificate     /etc/nginx/certs/jimmyweidev.com.pem;
    ssl_certificate_key /etc/nginx/certs/jimmyweidev.com.key;

    location / {
        proxy_pass http://assistant:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
