# Unified compose for the single EC2. Images are built in GitHub Actions and
# published to GHCR (ghcr.io/scorejim/*); this file only pulls and runs them.
# The EC2 needs just this `deploy/` directory (compose + nginx.conf + certs),
# not the four source repos.
#
# Sized for a t3.small (2 vCPU / 2 GB). PostgreSQL runs in a container (no RDS),
# the two Spring Boot JVMs are capped at 256 MB heap each, and every container
# has a hard memory ceiling. Requires a ~2 GB swap file on the host as a safety
# net — see README.md "Memory on t3.small".

services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - portfolio
      - neopick
      - agentsaul
      - assistant

  portfolio:
    image: ghcr.io/scorejim/personal-website:latest
    container_name: portfolio
    restart: unless-stopped
    mem_limit: 32m
    volumes:
      # Override the image's TLS-onboarding nginx.conf: the proxy does TLS here.
      - ./portfolio.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates neopick / agentsaul / ai_assistant + pgvector on first start only.
      - ./pg-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru

  neopick:
    image: ghcr.io/scorejim/neopick:latest
    container_name: neopick
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=160m"
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/neopick
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_SSL: "false"
      JWT_SECRET: ${NEOPICK_JWT_SECRET}
      # S3 / Aliyun SMS keys come from a gitignored .env on the box.

  agentsaul:
    image: ghcr.io/scorejim/agentsaul:latest
    container_name: agentsaul
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=160m"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentsaul
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${AGENTSAUL_REDIS_PASSWORD:-}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      AI_MODEL: ${AI_MODEL:-qwen3-vl-32b-thinking}

  assistant:
    image: ghcr.io/scorejim/ai-assistant:latest
    container_name: assistant
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_MODEL: ${AI_MODEL:-qwen3.8-27b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD}@postgres:5432/ai_assistant

volumes:
  postgres_data:
